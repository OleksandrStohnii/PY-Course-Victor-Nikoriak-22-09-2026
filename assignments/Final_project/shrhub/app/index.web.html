<style>
/* Закрытый клуб: зелёное сукно, латунь и слоновая кость. Одна колонка; серия побед стоит в центре как клубный герб между двойными латунными линейками. */
:root{--bg:#0a0a0a;--card:#141414;--card2:#1e1e1e;--line:#2b2b2b;--text:#f3f0e8;--muted:#9b978e;--up:#4fd18b;--down:#e5566b;--gold:#d4af5f;--goldHi:#f3dc9a;--vio:#d4af5f;--onGold:#1a1405;--onUp:#06200f;
  --rail:#000;--side:#0f0f0f;--panel:#070707;--bar:#050505;--goldA:rgba(212,175,95,.4);--hov:rgba(255,255,255,.05);--sel:rgba(255,255,255,.09);--sep:rgba(0,0,0,.6);--edge:rgba(255,255,255,.04);--scrimc:rgba(0,0,0,.8);--off:#5c5a55;--glow:#1b1b1b;
  --display:'Prata',Georgia,'Times New Roman',serif;--body:'Jost',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:dark}
body.light{--bg:#f6f5f1;--card:#fff;--card2:#efede7;--line:#dedad1;--text:#17150f;--muted:#6a665d;--up:#13915a;--down:#c9354d;--gold:#9c7726;--goldHi:#c9a14a;--vio:#9c7726;--onGold:#fff;--onUp:#fff;
  --rail:#e4e1d9;--side:#eeebe4;--panel:#e5e2da;--bar:#fff;--goldA:rgba(156,119,38,.35);--hov:rgba(0,0,0,.04);--sel:rgba(0,0,0,.08);--sep:rgba(0,0,0,.08);--edge:rgba(0,0,0,0);--scrimc:rgba(20,18,12,.45);--off:#b3afa6;--glow:#ffffff;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:var(--body);font-size:15px;background:var(--bg);color:var(--text);min-height:100vh;user-select:none}
button,input{font-family:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:480px;margin:0 auto;padding:14px 16px 96px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.logo{font-family:var(--display);font-size:21px;line-height:1.1}
.logo span{display:block;font-family:var(--body);font-size:12px;color:var(--gold);letter-spacing:.04em}
.pill{border:1px solid var(--goldA);border-radius:2px;padding:5px 9px;font-size:12px;font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.pro{background:var(--gold);border-color:var(--gold);color:var(--onGold);font-weight:600}
.demo{border-left:2px solid var(--gold);color:var(--muted);padding:4px 10px;font-size:12px;line-height:1.45;margin:12px 0}
.demo.live{border-left-color:var(--up);color:var(--up)}
.streak{text-align:center;margin:14px 0 8px;padding:14px 0 12px;border-top:3px double var(--goldA);border-bottom:3px double var(--goldA)}
.streak .n{font-family:var(--display);font-size:96px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.streak .l{color:var(--muted);font-size:13px;margin-top:4px}
.rec{display:flex;justify-content:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:12px;flex-wrap:wrap}
.rec b{color:var(--text);font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:10px}
.ph{display:flex;justify-content:space-between;align-items:center}
.pick{background:transparent;border:1px solid var(--gold);color:var(--text);border-radius:3px;padding:7px 12px;font-family:var(--display);font-size:16px}
.price{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
canvas{width:100%;height:110px;display:block;margin-top:8px}
.go{display:flex;gap:10px;margin-top:10px}
.go button{flex:1;border:none;border-radius:4px;padding:16px 0;font-family:var(--display);font-size:20px;cursor:pointer;transition:transform .06s}
.go button:active{transform:scale(.97)}
.go small{display:block;font-family:var(--body);font-size:12px;opacity:.8;margin-top:2px}
.bU{background:var(--up);color:var(--onUp)}.bD{background:var(--down);color:#fff}
.wait{text-align:center;padding:14px 0 4px}
.wait .t{font-family:var(--display);font-size:38px;color:var(--gold);font-variant-numeric:tabular-nums}
.muted{color:var(--muted);font-size:12px;line-height:1.45}
h2{font-family:var(--display);font-weight:400;font-size:22px;margin:14px 0 10px;text-wrap:balance}
.btn{border:1px solid transparent;border-radius:4px;padding:13px;font-weight:600;font-size:15px;cursor:pointer;width:100%;margin-top:8px}
.btn.v{background:transparent;border-color:var(--gold);color:var(--text)}
.btn.g{background:var(--gold);color:var(--onGold)}
.btn.ghost{background:var(--card2);color:var(--text)}
.btn.sm{width:auto;margin:0;padding:8px 12px;font-size:13px;white-space:nowrap}
.btn:disabled{opacity:.4}
.code{display:flex;align-items:center;justify-content:space-between;border:1px dashed var(--goldA);border-radius:3px;padding:10px 12px;margin-top:8px;font-family:ui-monospace,Menlo,monospace;font-weight:700;letter-spacing:2px}
.code.used{opacity:.4;text-decoration:line-through}
.code button{background:var(--gold);border:none;color:var(--onGold);border-radius:3px;padding:6px 10px;font-weight:600;font-size:12px;letter-spacing:0;font-family:var(--body)}
.fr{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.fr:last-child{border:none}.fr .n{flex:1;font-weight:500;min-width:0}.fr.me .n{color:var(--gold)}
.fr b{font-family:var(--display);font-weight:400;font-size:16px;font-variant-numeric:tabular-nums}
.fr .r{width:24px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.clap{background:transparent;border:1px solid var(--line);border-radius:3px;color:var(--text);padding:4px 7px;font-size:12px}
.plan{border:1px solid var(--line)}.plan.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.plan .h{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--display);font-size:20px}
.plan .h span:last-child{font-size:15px;color:var(--gold)}
.plan ul{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--muted);line-height:1.7}
input[type=text]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:4px;color:var(--text);padding:12px;font-size:15px;margin-top:8px;user-select:text}
input[type=range]{width:100%;margin:12px 0 4px;accent-color:var(--gold)}
.chat{max-height:220px;overflow-y:auto;margin-top:6px}
.msg{padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;display:flex;gap:8px;align-items:flex-start}
.msg b{white-space:nowrap;font-weight:600;color:var(--gold)}.msg span{flex:1;user-select:text}.msg i{font-style:normal;opacity:.5;font-size:12px}
.send{display:flex;gap:6px}.send input{margin-top:8px}.send .btn{margin-top:8px}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--bar);border-top:1px solid var(--goldA);display:flex;justify-content:center}
.nav div{display:flex;max-width:480px;width:100%}
.nav button{flex:1;background:none;border:none;color:var(--muted);padding:10px 0 12px;font-size:12px;font-weight:500}

  try{const cs=getComputedStyle(document.body);for(const k in CV){const v=cs.getPropertyValue('--'+k).trim();if(v)CV[k]=v}}catch(e){}
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=S.theme==='light'?'#f6f5f1':'#0a0a0a'}
function setTheme(x){if((x==='plat'||x==='emer')&&!S.owned[x]){offerItem(x);return}S.theme=x;applyTheme();save();render();draw()}
function draw(){
  const pr=S.pred,c=coin(pr?pr.sym:S.coin),H=c.h,w=cv.clientWidth,h=cv.clientHeight;cx.clearRect(0,0,w,h);
  if(H.length<2)return;
  let mn=Math.min(...H),mx=Math.max(...H);if(pr){mn=Math.min(mn,pr.entry,pr.target||pr.entry);mx=Math.max(mx,pr.entry,pr.target||pr.entry)}
  const pad=(mx-mn)*.15||mx*.001;mn-=pad;mx+=pad;
  const X=i=>i/(H.length-1)*w,Y=v=>h-(v-mn)/(mx-mn)*h;
  const col=pr?((c.p-pr.entry)*pr.dir>=0?CV.up:CV.down):CV.gold;
  cx.beginPath();H.forEach((v,i)=>i?cx.lineTo(X(i),Y(v)):cx.moveTo(X(i),Y(v)));cx.strokeStyle=col;cx.lineWidth=2;cx.stroke();
  function line(v,cl,tx){const y=Y(v);cx.setLineDash([4,4]);cx.strokeStyle=cl;cx.beginPath();cx.moveTo(0,y);cx.lineTo(w,y);cx.stroke();cx.setLineDash([]);cx.fillStyle=cl;cx.font='500 11px Jost,system-ui';cx.fillText(tx,4,y-3)}
  if(pr){line(pr.entry,CV.muted,t('start'));if(pr.target)line(pr.target,CV.text,t('target'))}
  $('price').textContent=usd(c.p);
  if(side&&!pr)updTi();
}
setInterval(()=>{
  if(!LIVE)COINS.forEach((c,i)=>{c.p*=1+(Math.random()-.5)*vol(i);c.h.push(c.p);if(c.h.length>61)c.h.shift()});
  draw();
  if(S.pred){const left=Math.max(0,S.pred.dur-(Date.now()-S.pred.t)/1000);
    $('tm').textContent=left>=60?Math.floor(left/60)+':'+String(Math.floor(left%60)).padStart(2,'0'):String(Math.ceil(left));
    if(left<=0)resolve()}
},400);

function tprice(){const c=coin(S.coin),v=+$('sl').value;return v?c.p*(1+side*rng(idx(c.s))*v/100):null}
function updTi(){const tp=tprice(),c=coin(S.coin);
  $('ti').textContent=tp?t('ti_t',usd(tp),(side>0?'+':'−')+Math.abs((tp/c.p-1)*100).toFixed(2)):t('ti_0')}

$('ok').onclick=()=>{const c=coin(S.coin);if(tprice())S.wk.tg++;S.pred={sym:c.s,dir:side,entry:c.p,target:tprice(),rng:rng(idx(c.s)),t:Date.now(),dur:HOUR,live:LIVE};side=0;save();render()};

function resolve(){
  const pr=S.pred,c=coin(pr.sym),win=(c.p-pr.entry)*pr.dir>0;S.pred=null;SENT={};
  S.total++;S.wk.f++;if(pr.dir>0)S.bulls++;else S.bears++;S.cc[pr.sym]=(S.cc[pr.sym]||0)+1;
  let pts=0,acc='';
  const mv=(c.p/pr.entry-1)*100,ex=pr.target?(pr.target/pr.entry-1)*100:null,sg=x=>(x>=0?'+':'−')+Math.abs(x).toFixed(2);
  if(win){S.wins++;pts=1;if(pr.target){const e=Math.abs(c.p-pr.target)/pr.entry/pr.rng,b=Math.round(9*Math.max(0,1-e/.35));pts+=b;if(b>=5)S.hits++;
    acc=`<div class="muted">${t('acc',usd(pr.target),usd(c.p))} ${t('accp',sg(ex),sg(mv))} ${b?t('bonus',b):t('nobonus')}</div>`}}
  S.hist.push({s:pr.sym,d:pr.dir,w:win?1:0,p:pts,e:ex==null?null:Math.abs(mv-ex)});if(S.hist.length>100)S.hist.shift();
  S.pts+=pts;
  if(warOn()&&pts){const d=pts*2;S.war.hpB=Math.max(0,S.war.hpB-d);S.war.my+=d;warLog(t('war_hour',pubName(),d),1)}
  let cm='';
  if(S.clan){let add=pts,best={me:true,p:pts};
    S.clan.members.forEach(m=>{if(m.me){m.pts+=pts}else if(Math.random()<.5){const p=1+(Math.random()<.25?[2,5,9][Math.floor(Math.random()*3)]:0);m.pts+=p;add+=p;if(p>best.p)best={n:m.n,p}}});
    S.clan.sniper=best.p>1?best:null;
    S.rivals.forEach(r=>r.pts+=Math.floor(Math.random()*S.clan.members.length*1.3));
    const bots=S.clan.members.filter(m=>!m.me);if(bots.length){const b=bots[Math.floor(Math.random()*bots.length)];say({n:b.n,f:b.f,k:Math.floor(Math.random()*TALK.length)})}
    if(add)cm=`<div class="muted" style="margin-top:6px">${S.clan.emb} ${t('clan_add',esc(S.clan.name),add)}</div>`}
  if(win){S.streak++;S.best=Math.max(S.best,S.streak);
    modal(`<div class="em">${pts>=6?'🎯':S.streak>=5?'🔥':'✅'}</div><h2>${t('won',pr.dir>0?t('bulls'):t('bears'),esc(c.s))}</h2><div style="font-family:var(--display);font-size:30px;color:var(--gold)">${t('inrow',S.streak)} · +${pts} 🎯</div>${acc}${cm}
      <button class="btn v" onclick="share()">${t('share')}</button><button class="btn ghost" onclick="closeModal()">${t('next')}</button>`)}
  else if(S.streak>=3){S.lost=S.streak;S.streak=0;
    const fc=S.codes.find(x=>!x.used);
    modal(`<div class="em">💔</div><h2>${t('lost',S.lost)}</h2><div class="muted">${t('lost_d')}</div>
      ${S.saves>0?`<button class="btn g" onclick="restore('save')">${t('use_save',S.saves)}</button>`:''}
      <button class="btn v" ${fc?'':'disabled'} onclick="restore('invite')">${t('inv_friend')}${fc?'':' ('+t('nocodes')+')'}</button>
      ${S.saves>0?'':`<button class="btn g" onclick="restore('pay')">${t('pay_save')}</button>`}
      <button class="btn ghost" onclick="closeModal()">${t('zero')}</button>${cm}`)}
  else{S.streak=0;modal(`<div class="em">📉</div><h2>${t('miss')}</h2><div class="muted">${t('miss_d')}</div>${cm}<button class="btn v" onclick="closeModal()">${t('again')}</button>`)}
  save();render();
}

  if(how==='invite'&&!invite())return;
  if(how==='save')S.saves--;
  S.streak=S.lost;S.lost=0;closeModal();toast(t('saved',S.streak)+(how==='pay'?' ('+t('nostars')+')':''));save();render()}

  const d=usbDist(i);u.last=d<=1?'us_hot':d===2?'us_warm':'us_cold';save();render()}
function usbHtml(){const u=usbInit(),over=u.found||u.digs.length>=5;
  return `<h2>💾 ${t('us_h')}</h2><div class="card"><div class="muted" style="font-size:14px;line-height:1.5">${t('us_d')}</div><div class="muted" style="margin-top:8px">${t('us_note')}</div></div>
    <div class="card"><div class="fr" style="border:none;padding:0 0 10px"><div class="n">${S.owned.shovel?'🌟⛏':'⛏'} ${t('us_left',5-u.digs.length)}</div><div class="muted">${t('us_total',u.total)}</div></div>
      <div class="dump">${Array.from({length:25},(_,i)=>{const dug=u.digs.includes(i),d=usbDist(i),hit=dug&&i===u.pos,show=over&&!u.found&&i===u.pos;
        return `<button class="${dug?(hit?'hit':d<=1?'hot':d===2?'warm':'cold'):''}" ${dug||over?'disabled':''} onclick="usbDig(${i})">${hit||show?'💾':dug?(d<=1?'🔥':d===2?'♨️':'❄️'):JUNK[(i*7+u.pos)%JUNK.length]}</button>`}).join('')}</div>
      <div style="text-align:center;margin-top:10px;font-weight:600">${u.found?t('us_done'):u.digs.length>=5?t('us_tom'):u.last?t(u.last):''}</div></div>`}
// ---------- новости участников ----------
const NSEED=[{id:'s0',a:'SHRhub',f:`<img class="aimg" src="${IMG.emb}" alt="">`,l:214,h:26},{id:'s1',a:'SHRhub',f:`<img class="aimg" src="${IMG.emb}" alt="">`,l:167,h:9},{id:'s2',a:'Влад',f:'🤠',l:38,h:3}];
function newsAll(){const sd=NSEED.map((x,i)=>({id:x.id,a:x.a,f:x.f,l:x.l,ts:Date.now()-x.h*3600000,t:t('n'+i),b:t('n'+i+'b')}));
  return [...S.news.map(x=>Object.assign({me:1},x)),...sd].sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)||b.ts-a.ts)}
function newsHtml(){return `<h2>${t('nw_h')}</h2><div class="demo">${t('nw_d')}</div><button class="btn g" style="margin:0 0 10px" onclick="newsOpen()">${t('nw_new')}</button>
  <div class="card" style="border-style:dashed;text-align:center"><span class="muted">${t('ad')}</span></div>
  ${newsAll().map(n=>`<div class="card"${n.pin?' style="border-color:var(--gold)"':''}><div class="cm" style="padding:0 0 6px"><div class="ava${n.me?frm():''}">${n.me?pubAv(34):n.f}</div><div class="body"><div class="nm"${n.me?' style="color:var(--gold)"':''}>${esc(n.me?pubName():n.a)}<time>${new Date(n.ts).toLocaleDateString(LOC[S.lang])} ${hm(n.ts)}${n.pin?' · 📌 '+t('nw_pinned'):''}</time></div></div></div>
    <div style="font-family:var(--display);font-size:18px;line-height:1.25;overflow-wrap:anywhere">${esc(n.t)}</div><div class="tx" style="font-size:14px;line-height:1.5;margin-top:6px;overflow-wrap:anywhere;user-select:text">${esc(n.b)}</div>
    <div class="row"><button class="opt ${S.nlike[n.id]?'on':''}" onclick="newsLike('${n.id}')">🔥 ${(n.l||0)+(S.nlike[n.id]?1:0)}</button>${n.me?`${n.pin?'':`<button class="opt" onclick="newsPin('${n.id}')">📌 ${t('nw_pin',100)}</button>`}<button class="opt" onclick="newsDel('${n.id}')">${t('nw_del')}</button>`:`<button class="opt" onclick="report()">🚩</button>`}</div></div>`).join('')}`}
function newsOpen(){modal(`<h2 style="margin-top:0">${t('nw_new')}</h2><input type="text" id="nwt" maxlength="80" placeholder="${t('nw_pt')}"><input type="text" id="nwb" maxlength="400" placeholder="${t('nw_pb')}"><div class="muted" style="margin-top:8px;text-align:left">${t('nw_d')}</div><button class="btn g" onclick="newsSend()">${t('nw_send')}</button><button class="btn ghost" onclick="closeModal()">${t('back')}</button>`)}
function newsSend(){const a=($('nwt').value||'').trim(),b=($('nwb').value||'').trim();if(a.length<5||b.length<10){toast(t('nw_need'));return}
  if(/https?:|t\.me|@\w{4,}/i.test(a+' '+b)){toast(t('nolinks'));return}
  S.news.unshift({id:'u'+Date.now(),t:a.slice(0,80),b:b.slice(0,400),ts:Date.now(),l:0});if(S.news.length>20)S.news.pop();closeModal();toast('📰 '+t('nw_done'));save();render()}
function newsLike(id){S.nlike[id]=!S.nlike[id];save();render()}
function newsPin(id){const n=S.news.find(x=>x.id===id);if(n){n.pin=1;toast('📌 '+t('nw_pinned')+' · 100 ⭐ ('+t('nostars')+')');save();render()}}
function newsDel(id){S.news=S.news.filter(x=>x.id!==id);save();render()}
function sendCode(c){copy(t('code_t',c));invite(c)}
function go(ch){S.srv=['clan','crank','cwar'].includes(ch)?'clan':'hub';if((ch==='crank'||ch==='cwar')&&!S.clan)ch='clan';S.ch=ch;UN[ch]=0;if(ch.startsWith('room:'))seedRoom(ch);
  const pg=ch.startsWith('room:')?'room':ch;document.querySelectorAll('.page').forEach(x=>x.classList.toggle('on',x.id==='p-'+pg));
  drawer(0);TYP=null;renderTyping();render();const e=$('scroll');if(e)e.scrollTop=isChat()?e.scrollHeight:0;if(pg==='game')setTimeout(()=>{fit();draw()},0);save()}
function drawer(o){$('app').classList.toggle('open',!!o)}
const TABS=[['game','🎯','nav_game'],['chats','💬','nav_chats'],['clan','🛡','nav_clan'],['video','▶️','nav_video'],['shop','⭐','nav_shop'],['me','👤','nav_me']];
function tabOf(ch){return ch==='an'||ch==='robot'||ch==='table'||ch==='usb'?'game':ch.startsWith('room:')||ch==='rules'||ch==='news'||ch==='chats'?'chats':ch==='crank'||ch==='cwar'?'clan':ch}
function back(){go(S.ch==='an'||S.ch==='robot'||S.ch==='table'||S.ch==='usb'?'game':S.ch==='crank'||S.ch==='cwar'?'clan':'chats')}
function subtabs(){return `<div class="subtabs"><button class="${S.ch==='clan'?'on':''}" onclick="go('clan')"># ${t('ch_clan')}</button><button class="${S.ch==='cwar'?'on':''}" onclick="go('cwar')">⚔️ ${t('ch_war')}${warOn()?' •':''}</button><button class="${S.ch==='crank'?'on':''}" onclick="go('crank')">🏆 ${t('ch_crank')}</button></div>`}
function chatsHtml(){const g=hubChans(),items=[...g[2][1].filter(c=>c[0]==='news'),...g[1][1],...g[0][1].filter(c=>c[0]==='an'),...g[3][1].filter(c=>c[0]==='rules')];
  return `<h2>${t('nav_chats')}</h2><div class="card">${items.map(([id,ic,nm,lk])=>{const r=S.rooms[id]||[],l=r[r.length-1];
    return `<button class="crow" onclick="${lk?`offerOne('${id.slice(5)}')`:`go('${id}')`}"><span class="ci2">${ic}</span><span class="cx"><b>${esc(nm)}</b><small>${l?esc((l.me?pubName():l.n)+': '+msgText(l)):esc(topic(id)||'')}</small></span>${lk?'<span>🔒</span>':UN[id]?`<span class="badge">${UN[id]}</span>`:''}</button>`}).join('')}</div>`}
function isChat(){return S.ch.startsWith('room:')||(S.ch==='clan'&&!!S.clan)}
function toBottom(){const e=$('scroll');if(e)e.scrollTop=e.scrollHeight}
let UN={},TYP=null;
const ONL={};NAMES.forEach((n,i)=>ONL[n]=i%3!==2);
function room(id){return S.rooms[id]||(S.rooms[id]=[])}
function pushRoom(id,m){const r=room(id),l=r[r.length-1];if(l&&!m.me&&l.k===m.k&&l.c===m.c){if(m.k!=null)m.k=(m.k+1)%TALK.length;else m.c=(m.c+1)%COINTALK.length}r.push(m);if(r.length>40)r.shift()}
function botMsg(x,ts){const i=Math.floor(Math.random()*NAMES.length),m={n:NAMES[i],f:FACES[i],ts:ts||Date.now()};
  if(x!=='general'&&Math.random()<.6){m.c=Math.floor(Math.random()*COINTALK.length);m.s=x}else m.k=Math.floor(Math.random()*TALK.length);return m}
function seedRoom(id){if(room(id).length)return;for(let i=0;i<3;i++)pushRoom(id,botMsg(id.slice(5),Date.now()-(3-i)*240000))}
function hm(ts){if(!ts)return '';const d=new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function msgHtml(m){const me=!!m.me;return `<div class="cm${m.g?' gold':''}"><div class="ava${me?frm():''}">${me?pubAv(34):m.f}</div><div class="body"><div class="nm"${me?' style="color:var(--gold)"':''}>${esc(me?pubName():m.n)}<time>${hm(m.ts)}</time></div><div class="tx">${m.gift!=null?`🎁 ${t('gift_msg',esc(m.to),GIFTS[m.gift].e+' '+t('g'+m.gift))}`:esc(msgText(m))}</div></div>${me?'':`<button class="rp" onclick="giftPick('${esc(m.n)}')" aria-label="${t('gift')}">🎁</button><button class="rp" onclick="report()" aria-label="Report">🚩</button>`}</div>`}
function chatHtml(arr,icon,title,desc){return `<div class="welcome"><div class="big">${icon}</div><h2>${esc(title)}</h2><div class="muted">${esc(desc)}</div></div>${arr.length?arr.map(msgHtml).join(''):`<div class="muted" style="padding:8px 0">${t('quiet')}</div>`}`}
function hubChans(){const free=[...new Set([...COINS.slice(0,3).map(c=>c.s),...S.extra])],paid=COINS.slice(3,6).map(c=>c.s).filter(x=>!free.includes(x));
  return [['cat_game',[['game','🎯',t('ch_game')],['an','#',t('ch_an')],['table','♠',t('ch_table')],['usb','💾',t('ch_usb')],['robot','🤖',t('ch_robot')]]],
    ['cat_talk',[['room:general','#',t('ch_general')],...free.map(x=>['room:'+x,'#',t('ch_room',x.toLowerCase())]),...paid.map(x=>['room:'+x,'#',t('ch_room',x.toLowerCase()),!allowed(x)])]],
    ['cat_media',[['news','📰',t('ch_news')],['video','▶',t('ch_video')]]],
    ['cat_club',[['shop','⭐',t('ch_shop')],['me','👤',t('ch_me')],['rules','§',t('ch_rules')]]]]}
function clanChans(){return S.clan?[['clans',[['clan','#',t('ch_clan')],['cwar','⚔️',t('ch_war')],['crank','🏆',t('ch_crank')]]]]:[['clans',[['clan','+',t('ch_join')]]]]}
function chanInfo(id){if(id==='chats')return ['chats','💬',t('nav_chats')];for(const g of hubChans().concat(clanChans()))for(const c of g[1])if(c[0]===id)return c;return ['game','🎯',t('ch_game')]}
function topic(id){return id==='news'?t('nw_h'):id==='game'?t('game_d'):id==='room:general'?t('gen_d'):id.startsWith('room:')?t('room_d',id.slice(5)):id==='clan'&&S.clan?t('chat_rule'):''}
function renderTyping(){const e=$('typing');if(e)e.textContent=TYP?t('typing',TYP):''}
let LG=0;
function logoSvg(h){const id='lg'+(++LG);return `<svg viewBox="-3 -3 216 46" height="${h}" role="img" aria-label="SHRhub" style="display:block;overflow:visible"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="40" gradientUnits="userSpaceOnUse"><stop offset="0" style="stop-color:var(--goldHi)"/><stop offset="1" style="stop-color:var(--gold)"/></linearGradient></defs><g fill="none" stroke="url(#${id})" stroke-width="7" stroke-linejoin="miter"><path d="M31 3.5H9L3.5 9v5.5L9 20h16l5.5 5.5V31L25 36.5H1"/><path d="M43.5 0v40M66.5 0v40M43.5 20h23"/><path d="M81.5 40V3.5H101l5.5 5.5v5.5L101 20H81.5M94 20l13 20"/></g><g fill="none" style="stroke:var(--text)" stroke-width="3.6" stroke-linejoin="miter"><path d="M124 0v40M124 16h15l4 4v20"/><path d="M153 14v22l4 4h12l4-4V14"/><path d="M183 0v40h16l4-4V18l-4-4h-16"/></g></svg>`}
function mono(){return `<svg viewBox="-3 -3 40 46" height="22" aria-hidden="true" style="display:block"><path d="M31 3.5H9L3.5 9v5.5L9 20h16l5.5 5.5V31L25 36.5H1" fill="none" stroke="currentColor" stroke-width="7"/></svg>`}
function renderShell(){const k=S.clan;
  $('rail').innerHTML=`<button class="srv logo ${S.srv==='hub'?'on':''}" onclick="go('game')" title="SHRhub" aria-label="SHRhub"><img src="${IMG.emb}" alt=""></button>
    <button class="srv" onclick="openAs()" title="${t('sp_h')}" aria-label="${t('sp_h')}">💬</button><div class="rsep"></div>
    ${k?`<button class="srv ${S.srv==='clan'?'on':''}" onclick="go('clan')" title="${esc(k.name)}" aria-label="${esc(k.name)}">${k.emb}</button>`:`<button class="srv add ${S.srv==='clan'?'on':''}" onclick="go('clan')" title="${t('clan_go')}" aria-label="${t('clan_go')}">+</button>`}`;
  $('srvh').innerHTML=S.srv==='clan'&&k?`${k.emb} ${esc(k.name)}<small>${t('clans')}</small>`:`${logoSvg(22)}<small style="margin-top:5px">${t('sub')}</small>`;
  const list=S.srv==='clan'?clanChans():hubChans();
  $('clist').innerHTML=list.map(([c,items])=>`<div class="cat">${t(c)}</div>`+items.map(([id,ic,nm,lk])=>`<button class="chan ${S.ch===id?'on':''}" onclick="${lk?`offerOne('${id.slice(5)}')`:`go('${id}')`}"><span class="h">${ic}</span>${esc(nm)}${lk?'<span class="lk">🔒</span>':UN[id]?`<span class="badge">${UN[id]}</span>`:''}</button>`).join('')).join('');
  $('upanel').innerHTML=`<div class="ava${frm()}">${pubAv(34)}<i class="dot"></i></div><div class="who">${esc(pubName())}<small>${t('rk'+rankIdx())} · 🎯 ${S.pts} · ${TIERS[S.tier].n}</small></div><button class="ib" style="font-size:17px" onclick="go('me')" aria-label="${t('ch_me')}">⚙</button>`;
  const ci=chanInfo(S.ch);$('chi').textContent=ci[1];$('chn').textContent=ci[2];$('cht').textContent=topic(S.ch);
  $('mem').innerHTML=membersHtml();$('gmb').className='gmb'+(S.gm?' on':'');$('thb').textContent=S.theme==='light'?'🌙':'☀️';$('thb').title=t('theme');
  $('backb').className='ib menu'+(['an','robot','table','usb','news','rules','crank','cwar'].includes(S.ch)||S.ch.startsWith('room:')?' show':'');
  $('tabs').innerHTML=TABS.map(([id,ic,k])=>{const n=id==='chats'?Object.keys(UN).filter(x=>x.startsWith('room:')).reduce((a,x)=>a+(UN[x]||0),0):id==='clan'?(warOn()?'⚔':(UN.clan||0)):0;
    return `<button class="${tabOf(S.ch)===id?'on':''}" onclick="go('${id}')"><span>${ic}${n?`<i>${n}</i>`:''}</span>${t(k)}</button>`}).join('');
  $('composer').className='composer'+(isChat()?' on':'');$('cmsg').placeholder=t('write')+' #'+ci[2]}
function membersHtml(){const ppl=S.srv==='clan'&&S.clan?S.clan.members.filter(m=>!m.me).map(m=>({n:m.n,f:m.f})):NAMES.map((n,i)=>({n,f:FACES[i]}));
  const on=ppl.filter(p=>ONL[p.n]!==false),off=ppl.filter(p=>ONL[p.n]===false);
  const row=(p,o)=>`<div class="mrow ${o?'':'off'}"><div class="ava">${p.f}<i class="dot ${o?'':'off'}"></i></div><div>${esc(p.n)}${o?`<small>${t('st_play',COINS[p.n.length%3].s)}</small>`:''}</div></div>`;
  return `<div class="mcat">${t('online',on.length+1)}</div><div class="mrow"><div class="ava${frm()}">${pubAv(34)}<i class="dot"></i></div><div>${esc(pubName())}<small>${t('rk'+rankIdx())}</small></div></div>${on.map(p=>row(p,1)).join('')}${off.length?`<div class="mcat">${t('offline',off.length)}</div>${off.map(p=>row(p,0)).join('')}`:''}`}
function membersModal(){modal(`<h2 style="margin-top:0">${t('members_h')}</h2><div class="list">${membersHtml()}</div><button class="btn ghost" onclick="closeModal()">${t('back')}</button>`)}
$('cmsg').onkeydown=e=>{if(e.key==='Enter')sendMsg()};
function rules(){modal(`<div style="text-align:right">${langSel('lang1','rules()')}</div>
  <img class="splash" src="${IMG.badge}" alt="SHARP CRYPTO"><div class="muted">${t('sub')}</div>
  <div style="font-family:var(--display);font-size:56px;margin:10px 0 4px">18+</div><div class="muted" style="margin-bottom:8px">${t('r1')}</div>
  <button class="btn g" onclick="S.ok18=true;save();closeModal()">${t('agree')}</button>`,true)}
document.documentElement.lang=LOC[S.lang];
{const td=new Date().toISOString().slice(0,10);if(S.lastDay!==td){const y=new Date(Date.now()-864e5).toISOString().slice(0,10);S.days=S.lastDay===y?S.days+1:1;S.lastDay=td;save()}}
if(!S.ch)S.ch='game';
applyTheme();
// активность ботов в залах и клане (демо)
setInterval(()=>{const ids=hubChans()[1][1].filter(x=>!x[3]).map(x=>x[0]);if(S.clan)ids.push('clan');const id=ids[Math.floor(Math.random()*ids.length)];
  let m=botMsg(id==='clan'?'general':id.slice(5));
  if(id==='clan'){const bots=S.clan.members.filter(x=>!x.me);if(!bots.length)return;const b=bots[Math.floor(Math.random()*bots.length)];m.n=b.n;m.f=b.f}
  const post=()=>{TYP=null;renderTyping();m.ts=Date.now();if(id==='clan'){if(!S.clan)return;say(m)}else pushRoom(id,m);
    if(S.ch!==id){UN[id]=(UN[id]||0)+1;renderShell()}else{render();toBottom()}save()};
  if(S.ch===id){TYP=m.n;renderTyping();setTimeout(post,2500)}else post()},9000);
setInterval(warTick,1000);setInterval(tbTick,500);setInterval(robotTick,1000);
go(S.ch);draw();
if(!S.ok18)rules();
</script>
